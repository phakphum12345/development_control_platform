# Same-origin HTTPS ingress template for DCP.
# TLS terminates at the trusted Azure ingress. The ingress must reject HTTP.
# Nginx, oauth2-proxy, the signer and Gateway must share a private network
# namespace; signer and Gateway listeners bind to 127.0.0.1 only.

events {}

http {
    upstream dcp_gateway {
        server 127.0.0.1:8789;
        keepalive 16;
    }

    upstream oauth2_proxy {
        server 127.0.0.1:4180;
        keepalive 8;
    }

    upstream dcp_identity_signer {
        server 127.0.0.1:8790;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;

        # Private auth subrequest. The signer independently asks oauth2-proxy
        # to validate the browser session before issuing any DCP assertion.
        location = /_dcp_auth {
            internal;
            proxy_method GET;
            proxy_pass http://dcp_identity_signer/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $uri;
        }

        # Internal redirect only: preserve the protected URL without allowing
        # a browser-supplied rd parameter to select an arbitrary destination.
        location @oauth2_start {
            auth_request off;
            rewrite ^ /oauth2/start break;
            proxy_pass http://oauth2_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Auth-Request-Redirect https://$host$request_uri;
            add_header Cache-Control "no-store" always;
        }

        # OIDC callback and logout are handled by oauth2-proxy.
        location ^~ /oauth2/ {
            auth_request off;
            proxy_pass http://oauth2_proxy;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Auth-Request-Groups "";
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header X-Auth-Request-Preferred-Username "";
            proxy_set_header X-Auth-Request-Access-Token "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Forwarded-Groups "";
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Forwarded-Preferred-Username "";
            proxy_set_header Authorization "";
            proxy_set_header X-Auth-Request-Redirect "";
            add_header Cache-Control "no-store" always;
        }

        # Browser API: no redirects on auth failure; return JSON 401 instead.
        location ^~ /api/ {
            auth_request /_dcp_auth;
            auth_request_set $dcp_user $upstream_http_x_dcp_user;
            auth_request_set $dcp_role $upstream_http_x_dcp_role;
            auth_request_set $dcp_session $upstream_http_x_dcp_session;
            auth_request_set $dcp_timestamp $upstream_http_x_dcp_auth_timestamp;
            auth_request_set $dcp_nonce $upstream_http_x_dcp_auth_nonce;
            auth_request_set $dcp_signature $upstream_http_x_dcp_auth_signature;
            auth_request_set $dcp_edge_cookie $upstream_http_set_cookie;
            error_page 401 = @api_unauthorized;

            add_header Set-Cookie $dcp_edge_cookie always;
            add_header Cache-Control "no-store" always;
            proxy_pass http://dcp_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Forwarded-Groups "";
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Forwarded-Preferred-Username "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Auth-Request-Groups "";
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header X-Auth-Request-Preferred-Username "";
            proxy_set_header X-Auth-Request-Access-Token "";

            # Overwrite every browser-supplied identity header with the signer
            # response. If authentication fails, Nginx never proxies the request.
            proxy_set_header X-DCP-User $dcp_user;
            proxy_set_header X-DCP-Role $dcp_role;
            proxy_set_header X-DCP-Session $dcp_session;
            proxy_set_header X-DCP-Auth-Timestamp $dcp_timestamp;
            proxy_set_header X-DCP-Auth-Nonce $dcp_nonce;
            proxy_set_header X-DCP-Auth-Signature $dcp_signature;
        }

        location @api_unauthorized {
            default_type application/json;
            return 401 '{"error":"authenticated session required"}';
        }

        # Protect the dashboard itself. A missing session starts OIDC login.
        location / {
            auth_request /_dcp_auth;
            auth_request_set $dcp_edge_cookie $upstream_http_set_cookie;
            error_page 401 = @oauth2_start;
            add_header Set-Cookie $dcp_edge_cookie always;
            add_header Cache-Control "no-store" always;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}

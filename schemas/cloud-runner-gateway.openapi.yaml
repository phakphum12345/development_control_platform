  /api/github/repositories:
    get:
      operationId: listGitHubAppRepositories
      summary: List repositories available to the DCP GitHub App installation
      description: |
        Requires a trusted-proxy authenticated browser session. Returns only
        normalized repository metadata from the DCP GitHub App installation;
        it does not list unrelated repositories from the user's GitHub account.
        Installation tokens and App credentials remain server-side.
      security:
        - TrustedProxyAssertion: []
      responses:
        '200':
          description: Installation repository catalog.
          content:
            application/json:
              schema:
                type: object
                required: [repositories]
                properties:
                  repositories:
                    type: array
                    items:
                      type: object
                      required: [full_name, private, default_branch, permissions]
                      properties:
                        full_name:
                          type: string
                          pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
                        private: { type: boolean }
                        default_branch: { type: string }
                        permissions:
                          type: object
                          additionalProperties: { type: boolean }
        '401': { description: Missing or invalid trusted-proxy identity. }
        '503': { description: GitHub App installation catalog is unavailable. }
  /api/github/repositories/{owner}/{repo}/refs:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
      - name: repo
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
    get:
      operationId: listGitHubRepositoryRefs
      summary: List branches or tags and their resolved commit SHAs
      description: |
        Requires a trusted-proxy authenticated browser session. The backend
        revalidates DCP GitHub App installation membership and uses a
        short-lived token scoped to the selected repository with Contents: read.
        If the App installation lacks that permission, the request fails closed.
      security:
        - TrustedProxyAssertion: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [branches, tags]
            default: branches
      responses:
        '200':
          description: Branch or tag metadata with full commit SHA.
          content:
            application/json:
              schema:
                type: object
                required: [repository, kind, refs]
                properties:
                  repository: { type: string }
                  kind: { type: string, enum: [branches, tags] }
                  refs:
                    type: array
                    items:
                      type: object
                      required: [name, commit_sha]
                      properties:
                        name: { type: string }
                        commit_sha:
                          type: string
                          pattern: '^[0-9a-f]{40}$'
        '400': { description: Invalid repository or ref kind. }
        '401': { description: Missing or invalid trusted-proxy identity. }
        '403': { description: Repository is outside the DCP GitHub App installation. }
        '503': { description: GitHub App Contents read permission or repository ref API is unavailable. }
  /api/github/repositories/{owner}/{repo}/commits/{sha}:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
      - name: repo
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
      - name: sha
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Fa-f0-9]{40}$'
    get:
      operationId: verifyGitHubRepositoryCommit
      summary: Verify that a full commit SHA belongs to the selected repository
      security:
        - TrustedProxyAssertion: []
      responses:
        '200':
          description: The exact commit SHA resolved inside the selected repository.
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha]
                properties:
                  repository: { type: string }
                  commit_sha:
                    type: string
                    pattern: '^[0-9a-f]{40}$'
        '400': { description: Invalid full commit SHA. }
        '401': { description: Missing or invalid trusted-proxy identity. }
        '403': { description: Repository is outside the DCP GitHub App installation. }
        '503': { description: GitHub App Contents read permission or commit lookup is unavailable. }
  /api/github/repositories/{owner}/{repo}/projects/{sha}:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
      - name: repo
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
      - name: sha
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Fa-f0-9]{40}$'
    get:
      operationId: inspectGitHubRepositoryProject
      summary: Detect project type and supported build targets at an immutable commit
      description: |
        Uses a repository-scoped Contents: read token to inspect Git tree paths and
        bounded pubspec.yaml manifest contents only. It never downloads application
        source files or executes project code. A truncated inventory returns UNKNOWN;
        absence of macOS files is not asserted when the inventory is incomplete.
      security:
        - TrustedProxyAssertion: []
      responses:
        '200':
          description: Bounded project and build-target assessment.
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha, status, project_types, file_count, truncated, flutter]
                properties:
                  repository: { type: string }
                  commit_sha: { type: string, pattern: '^[0-9a-f]{40}$' }
                  status: { type: string, enum: [target_detected, needs_setup, detected, unknown] }
                  project_types:
                    type: array
                    items: { type: string }
                  file_count: { type: integer, minimum: 0 }
                  truncated: { type: boolean }
                  flutter:
                    type: object
                    required: [detected, package_manifests, macos_supported, macos_runner_projects]
                    properties:
                      detected: { type: boolean }
                      package_manifests:
                        type: array
                        items: { type: string }
                      macos_supported:
                        type: [boolean, 'null']
                      macos_runner_projects:
                        type: array
                        items: { type: string }
                  notes:
                    type: array
                    items: { type: string }
        '400': { description: Invalid repository or full commit SHA. }
        '401': { description: Missing or invalid trusted-proxy identity. }
        '403': { description: Repository is outside the DCP GitHub App installation. }
        '503': { description: GitHub App Contents read permission or project inspection is unavailable. }
  /api/auth/session:
    get:
      operationId: getBrowserSession
      summary: Verify trusted reverse-proxy identity and issue a session-bound CSRF token
      description: Requires all signed X-DCP identity headers. The signature is generated only by the trusted OIDC reverse proxy.
      security:
        - TrustedProxyAssertion: []
      responses:
        '200':
          description: Authenticated session and CSRF token held in browser memory.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, csrfToken, user]
                properties:
                  authenticated: { type: boolean, const: true }
                  csrfToken: { type: string, minLength: 64, maxLength: 64 }
                  user:
                    type: object
                    properties:
                      displayName: { type: string }
                      role: { type: string, enum: [owner, operator] }
        '401': { description: Missing, invalid, expired, or replayed proxy identity. }
  /api/cloud-runners/status:
    get:
      operationId: getBrowserControlStatus
      summary: Read readiness gates for the browser control panel
      security:
        - TrustedProxyAssertion: []
      responses:
        '200':
          description: Current server-side gates. Unknown readiness must never be treated as pass.
          content:
            application/json:
              schema:
                type: object
                required: [gateway, owner_approved, provisioning_enabled, budget_gate, bootstrap_ready, providers]
                properties:
                  gateway: { type: string, enum: [READY] }
                  owner_approved: { type: boolean }
                  provisioning_enabled: { type: boolean }
                  budget_gate: { type: string, enum: [PASS, FAIL, UNKNOWN] }
                  budget_message: { type: string }
                  bootstrap_ready: { type: boolean }
                  circuit_breaker_tripped: { type: boolean }
                  providers: { type: object, additionalProperties: true }
        '401': { description: Authenticated proxy assertion required. }
  /api/cloud-runners:
    get:
      operationId: listBrowserRunners
      summary: List recent runner metadata
      security:
        - TrustedProxyAssertion: []
      responses:
        '200':
          description: Recent runner records without request payloads or credentials.
          content:
            application/json:
              schema:
                type: object
                required: [runners]
                properties:
                  runners:
                    type: array
                    items: { $ref: '#/components/schemas/Runner' }
        '401': { description: Authenticated proxy assertion required. }
    post:
      operationId: createBrowserRunner
      summary: Request an ephemeral runner through the guarded UI API
      description: Requires trusted proxy identity, exact Origin, session-bound CSRF, owner approval, provisioning enabled, live budget PASS, and selected provider bootstrap readiness.
      security:
        - TrustedProxyAssertion: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string, minLength: 64, maxLength: 64 }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerCreateRequest' }
      responses:
        '202':
          description: Request accepted; runner online state remains unverified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runner' }
        '401': { description: Authenticated proxy assertion required. }
        '403': { description: Origin or CSRF validation failed. }
        '409': { description: Idempotency conflict. }
        '429': { description: Budget, concurrency, or rate limit denied. }
        '503': { description: Owner, budget, provisioning, or provider bootstrap gate is not ready. }
  /api/cloud-runners/{id}:
    parameters:
      - $ref: '#/components/parameters/RunnerId'
    get:
      operationId: getBrowserRunner
      summary: Read a runner through the authenticated browser API
      security:
        - TrustedProxyAssertion: []
      responses:
        '200':
          description: Current lifecycle state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runner' }
        '401': { description: Authenticated proxy assertion required. }
        '404': { description: Runner not found. }
    delete:
      operationId: stopBrowserRunner
      summary: Request runner cleanup from the authenticated browser API
      security:
        - TrustedProxyAssertion: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200':
          description: Termination accepted or completed; verify terminal state separately.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runner' }
        '401': { description: Authenticated proxy assertion required. }
        '403': { description: Origin or CSRF validation failed. }
        '404': { description: Runner not found. }

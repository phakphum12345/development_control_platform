        '409': { description: Idempotency conflict. }
        '429': { description: Budget, concurrency, or rate limit denied. }
        '503': { description: Owner, budget, provisioning, or provider bootstrap gate is not ready. }
  /api/cloud-runners/{id}:
    parameters:
      - $ref: '#/components/parameters/RunnerId'
    get:
      operationId: getBrowserRunner

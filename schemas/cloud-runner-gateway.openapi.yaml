openapi: 3.1.0
info:
  title: DCP Cloud Runner Gateway API
  version: 1.0.0
  description: |
    Provider-neutral contract implemented by a separately deployed trusted gateway.
    This specification does not provision infrastructure and does not select a cloud vendor.
servers:
  - url: https://gateway.example.invalid
    description: Placeholder only; replace only after provider and gateway review.
security:
  - GatewayBearerAuth: []
paths:
  /v1/runners:
    post:
      operationId: createEphemeralRunner
      summary: Request an ephemeral macOS runner
      description: |
        The gateway must independently authenticate the caller, enforce repository
        allowlisting and idempotency, apply billing/runtime guardrails, create the VM,
        register a short-lived GitHub runner, and arrange teardown on completion,
        cancellation, or TTL expiry. A 202 response means accepted/provisioning only;
        it is not evidence that the runner is online or that a build passed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerCreateRequest'
      responses:
        '202':
          description: Request accepted; runner lifecycle is not yet verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency conflict or incompatible duplicate request.
        '429':
          description: Rate limit or provisioning concurrency limit reached.
        '503':
          description: Provider unavailable or provisioning disabled.
  /v1/runners/{id}:
    parameters:
      - $ref: '#/components/parameters/RunnerId'
    get:
      operationId: getRunner
      summary: Read runner lifecycle state
      responses:
        '200':
          description: Current lifecycle state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Runner not found.
    delete:
      operationId: terminateRunner
      summary: Request runner teardown
      responses:
        '200':
          description: Teardown accepted or completed; verify terminal state separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Runner not found.
components:
  securitySchemes:
    GatewayBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    RunnerId:
      name: id
      in: path
      required: true
      description: Opaque gateway identifier; clients must URL-encode it as one path segment.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  schemas:
    RunnerCreateRequest:
      type: object
      additionalProperties: false
      required:
        - repository
        - workflow_run_id
        - commit_sha
        - image
        - labels
        - ephemeral
        - max_runtime_minutes
        - network_policy
        - registration_token_handling
      properties:
        repository:
          type: string
          pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
        workflow_run_id:
          type: integer
          minimum: 1
        commit_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        image:
          type: string
          const: macos-15-arm64
        labels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        ephemeral:
          type: boolean
          const: true
        max_runtime_minutes:
          type: integer
          minimum: 5
          maximum: 180
        network_policy:
          type: string
          const: restricted-egress
        registration_token_handling:
          type: string
          const: provider-side-only
    Runner:
      type: object
      additionalProperties: true
      required: [id, state]
      properties:
        id:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
          description: Lifecycle state such as provisioning, online, terminating, terminated, or failed.
        runner_name:
          type: string
        labels:
          type: array
          items:
            type: string
        detail:
          type: string
    Error:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        detail:
          type: string
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid gateway bearer token.
    Forbidden:
      description: Caller or repository is not authorized.

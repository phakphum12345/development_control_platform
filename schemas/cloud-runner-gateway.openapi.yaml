    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
      - name: repo
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
    get:
      operationId: listGitHubRepositoryRefs
      summary: List branches or tags and their resolved commit SHAs
      description: |
        Requires a trusted-proxy authenticated browser session. The backend
        revalidates DCP GitHub App installation membership and uses a
        short-lived token scoped to the selected repository with Contents: read.
        If the App installation lacks that permission, the request fails closed.
      security:
        - TrustedProxyAssertion: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [branches, tags]
            default: branches
      responses:
        '200':
          description: Branch or tag metadata with full commit SHA.
          content:
            application/json:
              schema:
                type: object
                required: [repository, kind, refs]
                properties:
                  repository: { type: string }
                  kind: { type: string, enum: [branches, tags] }
                  refs:
                    type: array
                    items:
                      type: object
                      required: [name, commit_sha]
                      properties:
                        name: { type: string }
                        commit_sha:
                          type: string
                          pattern: '^[0-9a-f]{40}$'
        '400': { description: Invalid repository or ref kind. }
        '401': { description: Missing or invalid trusted-proxy identity. }
        '403': { description: Repository is outside the DCP GitHub App installation. }
        '503': { description: GitHub App Contents read permission or repository ref API is unavailable. }
  /api/github/repositories/{owner}/{repo}/commits/{sha}:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
      - name: repo
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
      - name: sha
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Fa-f0-9]{40}$'
    get:
      operationId: verifyGitHubRepositoryCommit
      summary: Verify that a full commit SHA belongs to the selected repository
      security:
        - TrustedProxyAssertion: []
      responses:
        '200':
          description: The exact commit SHA resolved inside the selected repository.
          content:
            application/json:
              schema:
                type: object
                required: [repository, commit_sha]
                properties:
                  repository: { type: string }

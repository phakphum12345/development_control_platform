          type: string
          minLength: 1
          description: provisioning, online, terminating, terminated, or failed.
        runner_name: { type: string }
        labels:
          type: array
          items: { type: string }
        detail: { type: string }
    Error:
      type: object
      additionalProperties: true
      properties:
        error: { type: string }
        detail: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized: { description: Missing or invalid gateway bearer token. }
    Forbidden: { description: Caller or repository is not authorized. }

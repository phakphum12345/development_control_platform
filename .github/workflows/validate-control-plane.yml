name: Validate Control Plane

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_self_hosted_windows_acceptance:
        description: "Run acceptance checks on registered local Windows runners (requires them to be online)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators and local MCP SDK
        run: |
          python -m pip install --disable-pip-version-check PyYAML jsonschema
          python -m pip install --disable-pip-version-check -r requirements-mcp.txt

      - name: Set up Node for dashboard JavaScript syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check embedded dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("dashboard/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert len(scripts) == 1, f"Expected exactly one inline script; got {len(scripts)}"
          Path("dashboard-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check dashboard-inline.js
          python -c "from pathlib import Path; Path('dashboard-inline.js').unlink()"

      - name: Validate dashboard and Python contracts
        run: python -m unittest discover -s tests -v

      - name: Install Playwright for browser smoke tests
        run: npm install --no-save --no-package-lock playwright

      - name: Install Python Playwright for DCP application tests
        run: python -m pip install "playwright>=1.48"

      - name: Install Chromium browser
        run: |
          npx playwright install chromium
          python -m playwright install chromium

      - name: Allow Chromium user namespaces with a path-scoped AppArmor profile
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ ! -r "$restriction" ]] || [[ "$(cat "$restriction")" != "1" ]]; then
            echo "APPARMOR_USERNS_RESTRICTION=not-active"
            exit 0
          fi

          browser="$(find "$HOME/.cache/ms-playwright" -type f \
            -path '*/chrome-headless-shell-linux64/chrome-headless-shell' \
            -print -quit)"
          if [[ -z "$browser" ]]; then
            echo "::error::Playwright headless Chromium executable was not found."
            exit 1
          fi
          case "$browser" in
            "$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell) ;;
            *)
              echo "::error::Refusing to authorize an unexpected Chromium path: $browser"
              exit 1
              ;;
          esac

          profile=/etc/apparmor.d/dcp-playwright-chromium
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            '' \
            "profile dcp-playwright-chromium $browser flags=(unconfined) {" \
            '  userns,' \
            '}' | sudo tee "$profile" >/dev/null
          sudo apparmor_parser -r "$profile"
          echo "APPARMOR_CHROMIUM_PROFILE=loaded"
          echo "APPARMOR_CHROMIUM_PATH=$browser"

      - name: Inspect Linux Chromium sandbox prerequisites (read-only)
        if: runner.os == 'Linux'
        run: |
          id
          uname -a
          python - <<'PY'
          from pathlib import Path
          for name in (
              "/proc/sys/kernel/unprivileged_userns_clone",
              "/proc/sys/user/max_user_namespaces",
              "/proc/sys/kernel/apparmor_restrict_unprivileged_userns",
              "/proc/self/status",
          ):
              path = Path(name)
              print(f"===== {name} =====")
              try:
                  text = path.read_text(encoding="utf-8")
                  if name.endswith("/status"):
                      text = "\\n".join(
                          line for line in text.splitlines()
                          if line.startswith(("Uid:", "Gid:", "NoNewPrivs:", "Seccomp:", "CapEff:"))
                      )
                  print(text.strip())
              except OSError as exc:
                  print(f"UNAVAILABLE: {type(exc).__name__}")
          PY
          if command -v unshare >/dev/null 2>&1; then
            unshare -Ur true && echo "USER_NAMESPACE_PROBE=PASS" || echo "USER_NAMESPACE_PROBE=FAIL"
          else
            echo "USER_NAMESPACE_PROBE=UNKNOWN (unshare command unavailable)"
          fi

      - name: Test DCP local static application with real Chromium
        env:
          DEBUG: pw:browser
        run: python -m unittest tests.test_browser_test.StaticWebPlaywrightTesterTests.test_real_chromium_smoke_creates_screenshots_report_and_evidence -v

      - name: Test authenticated Preview Proxy in sandboxed Chromium
        env:
          DEBUG: pw:browser
        run: python -m unittest tests.test_local_auth_proxy.LocalAuthProxyEndToEndTests.test_real_chromium_loads_app_through_authenticated_preview_proxy -v

      - name: Install Firefox and WebKit with system prerequisites
        run: python -m playwright install --with-deps firefox webkit

      - name: Verify all browser engine executables are present
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              for name in ("chromium", "firefox", "webkit"):
                  executable = Path(getattr(playwright, name).executable_path)
                  if not executable.is_file():
                      raise SystemExit(f"{name} executable is missing: {executable}")
                  print(f"{name}: installed")
          PY

      - name: Test authenticated Preview Proxy in Firefox
        env:
          DEBUG: pw:browser
        run: python -m unittest tests.test_local_auth_proxy.LocalAuthProxyEndToEndTests.test_real_firefox_loads_app_through_authenticated_preview_proxy -v

      - name: Test authenticated Preview Proxy in WebKit
        env:
          DEBUG: pw:browser
        run: python -m unittest tests.test_local_auth_proxy.LocalAuthProxyEndToEndTests.test_real_webkit_loads_app_through_authenticated_preview_proxy -v

      - name: Test dashboard in a real browser
        run: node tests/browser_smoke.mjs

      - name: Validate registry YAML and JSON Schema
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator, FormatChecker

          registry_path = Path("config/projects.yml")
          schema_path = Path("schemas/project-state.schema.json")

          # BaseLoader avoids YAML 1.1 coercion of the GitHub Actions key "on".
          registry = yaml.load(
              registry_path.read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader,
          )
          assert isinstance(registry, dict), "Registry must be a YAML mapping"
          assert registry.get("version") == "1", "Unsupported registry version"
          assert isinstance(registry.get("projects"), list), \
              "projects must be a list"

          policy = registry.get("policy")
          assert isinstance(policy, dict), "policy must be a mapping"
          assert policy.get("merge_requires_all_required_gates_passed") == "true"
          assert policy.get("missing_gate_result") == "unknown"
          assert policy.get("allow_force_push") == "false"
          assert policy.get("allow_history_rewrite") == "false"
          assert policy.get("require_sha_bound_evidence") == "true"
          assert policy.get("require_human_approval_for_new_write_scopes") == "true"
          assert policy.get("integrations_enabled_by_default") == "false"

          seen_ids = set()
          for project in registry["projects"]:
              assert isinstance(project, dict), "Each project must be a mapping"
              for field in (
                  "id", "name", "repository", "default_branch",
                  "status_source", "required_gates"
              ):
                  assert field in project, f"Project missing {field}"

              project_id = project["id"]
              assert project_id and project_id not in seen_ids, \
                  "Project IDs must be nonempty and unique"
              seen_ids.add(project_id)

              assert re.fullmatch(
                  r"[^/\s]+/[^/\s]+", project["repository"]
              ), f"Invalid repository name for {project_id}"
              assert project["default_branch"]
              assert project["status_source"] in ("manual", "github")
              assert isinstance(project["required_gates"], list)
              assert all(project["required_gates"]), \
                  "Required gate names must be nonempty"

          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(
              schema, format_checker=FormatChecker()
          )

          # Validate persisted project states against the opt-in registry.
          state_dir = Path("states")
          state_files = sorted(state_dir.glob("*.json")) if state_dir.is_dir() else []
          project_by_id = {project["id"]: project for project in registry["projects"]}

          assert len(state_files) == len(project_by_id), (
              "Each registered project must have exactly one states/*.json file; "
              "remove orphan states or add the missing project state."
          )

          def check_required_gate_status(required_gate_names, state):
              gate_by_name = {gate["name"]: gate for gate in state["gates"]}
              for gate_name in required_gate_names:
                  gate = gate_by_name.get(gate_name)
                  if gate is None:
                      raise ValueError(
                          f"Required gate '{gate_name}' is missing from project state"
                      )
                  if gate["status"] != "pass":
                      raise ValueError(
                          f"Required gate '{gate_name}' must be pass; "
                          f"got {gate['status']!r}"
                      )

          states_by_id = {}
          for state_path in state_files:
              state = json.loads(state_path.read_text(encoding="utf-8"))
              validator.validate(state)

              project_id = state["project_id"]
              assert project_id in project_by_id, (
                  f"{state_path}: project_id is not registered: {project_id}"
              )
              assert project_id not in states_by_id, (
                  f"Duplicate state for project_id: {project_id}"
              )

              project = project_by_id[project_id]
              assert state["repository"] == project["repository"], (
                  f"{state_path}: repository does not match registry"
              )
              assert state["branch"] == project["default_branch"], (
                  f"{state_path}: branch does not match registry default_branch"
              )

              gate_names = [gate["name"] for gate in state["gates"]]
              assert len(gate_names) == len(set(gate_names)), (
                  f"{state_path}: duplicate gate names"
              )

              missing_gates = set(project["required_gates"]) - set(gate_names)
              assert not missing_gates, (
                  f"{state_path}: required gates missing; record their status as "
                  f"'unknown': {sorted(missing_gates)}"
              )

              for gate in state["gates"]:
                  assert gate["commit_sha"] == state["commit_sha"], (
                      f"{state_path}: gate '{gate['name']}' SHA does not match "
                      "project commit_sha"
                  )

              # Registration validation checks structure and SHA-bound evidence only.
              # UNKNOWN/FAIL/PENDING states are valid records, not merge approval.
              # Readiness is evaluated separately by the quality-gate planner/policy.
              states_by_id[project_id] = state

          assert set(states_by_id) == set(project_by_id), (
              "Registered projects and validated project states must match exactly"
          )
          sha = "a" * 40
          valid_state = {
              "project_id": "validation-fixture",
              "repository": "example/project",
              "branch": "main",
              "commit_sha": sha,
              "observed_at": "2026-01-01T00:00:00Z",
              "gates": [{
                  "name": "fixture",
                  "status": "pass",
                  "commit_sha": sha,
                  "observed_at": "2026-01-01T00:00:00Z",
                  "evidence_url": "https://example.com/evidence/1"
              }]
          }
          validator.validate(valid_state)

          mismatch_state = json.loads(json.dumps(valid_state))
          mismatch_state["gates"][0]["commit_sha"] = "b" * 40
          mismatch_errors = list(validator.iter_errors(mismatch_state))
          # JSON Schema checks SHA format; cross-field SHA equality is a
          # semantic check and is deliberately enforced separately below.
          assert not mismatch_errors

          def check_sha_binding(state):
              for gate in state["gates"]:
                  if gate["commit_sha"] != state["commit_sha"]:
                      raise ValueError("Gate evidence SHA does not match project SHA")

          try:
              check_sha_binding(mismatch_state)
          except ValueError:
              pass
          else:
              raise AssertionError(
                  "Mismatched gate evidence SHA was accepted"
              )
          nonpassing_state = json.loads(json.dumps(valid_state))
          nonpassing_state["gates"][0]["status"] = "unknown"
          try:
              check_required_gate_status(["fixture"], nonpassing_state)
          except ValueError:
              pass
          else:
              raise AssertionError("Required gate with unknown status was accepted")

          missing_gate_state = json.loads(json.dumps(valid_state))
          try:
              check_required_gate_status(["missing-fixture"], missing_gate_state)
          except ValueError as error:
              assert "missing-fixture" in str(error), (
                  "Missing-gate error must identify the missing gate"
              )
          else:
              raise AssertionError("Missing required gate was accepted")

          no_evidence_state = json.loads(json.dumps(valid_state))
          del no_evidence_state["gates"][0]["evidence_url"]
          assert list(validator.iter_errors(no_evidence_state)), \
              "Passing gate without evidence URL must be rejected"

          print(f"Registry structure and policy checks passed ({len(registry['projects'])} registered projects).")

          print("JSON Schema meta-validation and evidence fixtures passed.")
          PY

  windows-launcher-integration:
    name: Windows dynamic-port launcher integration
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cloud gateway test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-gateway.txt

      - name: Exercise Windows Flutter batch shim with real cmd.exe
        run: python -m unittest tests.test_local_runner_execution.WindowsFlutterBatchShimAcceptanceTests -v

      - name: Exercise Windows Runner job-to-artifact pipeline through real cmd.exe
        run: python -m unittest tests.test_local_runner_pipeline_e2e.WindowsRunnerPipelineAcceptanceTests -v

      - name: Exercise legacy Runner batch launcher and secret isolation on Windows
        run: python -m unittest tests.test_runner_agent.WindowsLegacyRunnerAcceptanceTests -v

      - name: Parse generated Windows runner bootstrap PowerShell
        shell: pwsh
        run: |
          python tests/emit_runner_bootstrap_scripts.py $env:RUNNER_TEMP
          $scriptPaths = @(
            (Join-Path $env:RUNNER_TEMP "dcp-windows-bootstrap.ps1"),
            (Join-Path $env:GITHUB_WORKSPACE "Setup-DCP-Local-Runner.ps1"),
            (Join-Path $env:GITHUB_WORKSPACE "Start-DCP-Gateway-Runner.ps1")
          )
          foreach ($scriptPath in $scriptPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "Invalid PowerShell script: $scriptPath"
            }
          }

      - name: Exercise protected local Runner credential setup
        shell: pwsh
        run: ./tests/test_local_runner_bootstrap.ps1

      - name: Exercise dynamic dashboard start, reuse, and stop
        shell: pwsh
        run: ./tests/test_dashboard_dynamic_port.ps1

      - name: Check for likely credential patterns
        shell: bash
        run: |
          if grep -RInE \
            '(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})' \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=node_modules \
            --exclude='*.lock' \
            .; then
            echo "::error::Potential credential pattern found."
            exit 1
          fi
  windows-runner-smoke-test:
    name: Windows runner acceptance (${{ matrix.runner_name }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_self_hosted_windows_acceptance == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_name: PHAKPHUM-LOCAL-DEV
            runner_label: local-dev
          - runner_name: PHAKPHUMWIR
            runner_label: windows-local-2
    runs-on: [self-hosted, Windows, X64, "${{ matrix.runner_label }}"]
    steps:
      - name: Checkout repository for workspace test
        uses: actions/checkout@v4

      - name: Set up Python for Local Folder Runner acceptance
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gateway runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-gateway.txt

      - name: Verify Windows runner identity
        shell: pwsh
        env:
          EXPECTED_RUNNER_NAME: ${{ matrix.runner_name }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RUNNER_OS -ne "Windows") {
            throw "Expected Windows runner; got '$env:RUNNER_OS'"
          }

          if ($env:RUNNER_NAME -ne $env:EXPECTED_RUNNER_NAME) {
            throw "Unexpected runner name: '$env:RUNNER_NAME'; expected '$env:EXPECTED_RUNNER_NAME'"
          }

          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "Windows runner smoke test passed."

      - name: Verify local file read and write
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testDir = Join-Path $env:RUNNER_TEMP "dcp-runner-rw-test"
          $testFile = Join-Path $testDir "read-write-check.txt"
          $expected = "runner-read-write-ok"
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          Set-Content -LiteralPath $testFile -Value $expected -Encoding utf8
          if (-not (Test-Path -LiteralPath $testFile -PathType Leaf)) { throw "WRITE FAILED: test file was not created." }
          $actual = (Get-Content -LiteralPath $testFile -Raw).Trim()
          if ($actual -ne $expected) { throw "READ/WRITE FAILED: content mismatch." }
          Write-Host "WRITE PASS: test file created."
          Write-Host "READ PASS: content matches."
          Write-Host "Path: $testFile"
          Remove-Item -LiteralPath $testFile -Force
          Write-Host "CLEANUP PASS: temporary test file removed."

      - name: Exercise Local Folder snapshot-to-build pipeline on this Windows host
        run: |
          python -m unittest \
            tests.test_local_runner_pipeline_e2e.RunnerPipelineEndToEndTests.test_local_folder_static_build_uses_immutable_snapshot_and_trusted_project_allowlist \
            tests.test_local_runner_pipeline_e2e.RunnerPipelineEndToEndTests.test_local_folder_job_fails_closed_without_explicit_project_trust -v

      - name: Verify repository workspace read and write
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = $env:GITHUB_WORKSPACE
          if ([string]::IsNullOrWhiteSpace($workspace) -or -not (Test-Path -LiteralPath $workspace -PathType Container)) { throw "Workspace is missing or inaccessible." }
          $fileName = ".runner-rw-check-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.txt"
          $testFile = Join-Path $workspace $fileName
          $expected = "repository-workspace-read-write-ok"
          if (Test-Path -LiteralPath $testFile) { throw "Test file already exists; refusing to overwrite it." }
          try {
            Set-Content -LiteralPath $testFile -Value $expected -Encoding utf8
            if (-not (Test-Path -LiteralPath $testFile -PathType Leaf)) { throw "WORKSPACE WRITE FAILED: file was not created." }
            $actual = (Get-Content -LiteralPath $testFile -Raw).Trim()
            if ($actual -ne $expected) { throw "WORKSPACE READ/WRITE FAILED: content mismatch." }
            Write-Host "WORKSPACE WRITE PASS"
            Write-Host "WORKSPACE READ PASS"
            Write-Host "Workspace: $workspace"
          }
          finally { if (Test-Path -LiteralPath $testFile -PathType Leaf) { Remove-Item -LiteralPath $testFile -Force } }
          if (Test-Path -LiteralPath $testFile) { throw "WORKSPACE CLEANUP FAILED: test file remains." }
          Write-Host "WORKSPACE CLEANUP PASS"

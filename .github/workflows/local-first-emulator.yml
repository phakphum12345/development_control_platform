name: Local-first Minimal Emulator

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-minimal-emulator:
    name: Linux Minimal Emulator (Gateway + health + safe defaults)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Gateway runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-gateway.txt
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python -m pip install --disable-pip-version-check -r requirements-mcp.txt
      - name: Run local diagnostics and unit tests
        env:
          DCP_GATEWAY_PROVISIONING_ENABLED: "false"
          DCP_GATEWAY_OWNER_APPROVED: "false"
        run: |
          python -m tools.cloud_gateway.local_mode
          python -m unittest discover -s tests -v
      - name: Start Gateway and verify health, auth boundary, and disabled provisioning
        env:
          DCP_GATEWAY_API_TOKEN: emulator-test-token-not-for-production
          DCP_GATEWAY_HOST: 127.0.0.1
          DCP_GATEWAY_PORT: "18789"
          DCP_GATEWAY_DATABASE: ${{ runner.temp }}/dcp-emulator.sqlite3
          DCP_GATEWAY_PROVISIONING_ENABLED: "false"
          DCP_GATEWAY_OWNER_APPROVED: "false"
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time, urllib.error, urllib.request
          process = subprocess.Popen([sys.executable, "-m", "tools.cloud_gateway.server"])
          base = "http://127.0.0.1:" + os.environ["DCP_GATEWAY_PORT"]
          try:
              for _ in range(40):
                  if process.poll() is not None:
                      raise RuntimeError(f"Gateway exited early: {process.returncode}")
                  try:
                      with urllib.request.urlopen(base + "/healthz", timeout=1) as response:
                          health = json.load(response)
                      break
                  except Exception:
                      time.sleep(0.25)
              else:
                  raise RuntimeError("Gateway did not become healthy")
              assert health == {"status": "ok", "provisioning_enabled": False}, health
              request = urllib.request.Request(base + "/v1/runners/unknown")
              try:
                  urllib.request.urlopen(request, timeout=2)
                  raise AssertionError("Unauthenticated API request was accepted")
              except urllib.error.HTTPError as error:
                  assert error.code == 401, error.code
              request = urllib.request.Request(
                  base + "/v1/runners/unknown",
                  headers={"Authorization": "Bearer " + os.environ["DCP_GATEWAY_API_TOKEN"]},
              )
              try:
                  urllib.request.urlopen(request, timeout=2)
                  raise AssertionError("Unknown runner unexpectedly returned success")
              except urllib.error.HTTPError as error:
                  assert error.code == 404, error.code
              print("PASS: Gateway health, bearer-auth boundary, and local-only safe defaults")
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
          PY

  windows-11-launcher-emulator:
    name: Windows 11 local Auth Proxy + Gateway end-to-end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Gateway runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-gateway.txt
      - name: Parse all local PowerShell launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('Setup-DCP-Local.ps1', 'Run-DCP-Gateway.ps1', 'Start-DCP-Local.ps1', 'Start-DCP-Dashboard.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; throw "PowerShell parse failed: $file" }
            Write-Host "PASS: $file"
          }
      - name: Run setup preflight
        shell: pwsh
        run: ./Setup-DCP-Local.ps1
      - name: Start local stack and verify browser-to-Gateway authentication end to end
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DCP_LOCAL_AUTH_CREDENTIAL_FILE = Join-Path $env:RUNNER_TEMP 'dcp-owner-auth.json'
          $env:DCP_SKIP_OPEN_BROWSER = '1'
          @'
          import json, os
          from pathlib import Path
          from tools.local_auth_proxy import password_record
          Path(os.environ["DCP_LOCAL_AUTH_CREDENTIAL_FILE"]).write_text(json.dumps(password_record("ci-owner", "ci-only-password-2026!")), encoding="utf-8")
          '@ | python -
          try {
            ./Start-DCP-Local.ps1
            $base = 'http://127.0.0.1:8789'
            $health = Invoke-RestMethod -Uri "$base/healthz" -TimeoutSec 5
            if ($health.status -ne 'ok' -or $health.auth_proxy -ne 'ready' -or $health.provisioning_enabled -ne $false) { throw 'Local stack health contract failed.' }
            $dashboard = Invoke-WebRequest -Uri "$base/" -UseBasicParsing -TimeoutSec 5
            if ($dashboard.StatusCode -ne 200 -or $dashboard.Content -notmatch 'auth-login-form') { throw 'Dashboard was not served by the local auth proxy.' }
            $web = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $preauth = Invoke-RestMethod -Uri "$base/api/auth/session" -WebSession $web -TimeoutSec 5
            if ($preauth.authenticated -ne $false -or $preauth.csrfToken.Length -lt 32) { throw 'Pre-auth session/CSRF challenge missing.' }
            $originHeaders = @{ Origin = $base; 'X-CSRF-Token' = $preauth.csrfToken }
            $loginBody = @{ username = 'ci-owner'; password = 'ci-only-password-2026!' } | ConvertTo-Json -Compress
            $login = Invoke-RestMethod -Uri "$base/api/auth/login" -Method Post -WebSession $web -Headers $originHeaders -ContentType 'application/json' -Body $loginBody -TimeoutSec 10
            if ($login.authenticated -ne $true) { throw 'Local password login failed.' }
            $session = Invoke-RestMethod -Uri "$base/api/auth/session" -WebSession $web -TimeoutSec 5
            if ($session.authenticated -ne $true -or $session.user.role -ne 'owner') { throw 'Owner session was not established.' }
            # Re-request the dashboard with the same cookie jar, as a browser reload would,
            # and prove the HttpOnly session remains authenticated across navigation.
            $dashboardAfterLogin = Invoke-WebRequest -Uri "$base/" -WebSession $web -UseBasicParsing -TimeoutSec 5
            if ($dashboardAfterLogin.StatusCode -ne 200) { throw 'Dashboard reload after login failed.' }
            $sessionAfterReload = Invoke-RestMethod -Uri "$base/api/auth/session" -WebSession $web -TimeoutSec 5
            if ($sessionAfterReload.authenticated -ne $true -or $sessionAfterReload.user.role -ne 'owner') { throw 'Owner session did not survive dashboard reload.' }
            $status = Invoke-RestMethod -Uri "$base/api/cloud-runners/status" -WebSession $web -TimeoutSec 5
            if ($status.gateway -ne 'READY' -or $status.provisioning_enabled -ne $false) { throw 'Signed browser-session to Gateway API request failed or safe defaults changed.' }
            $logoutHeaders = @{ Origin = $base; 'X-CSRF-Token' = $session.csrfToken }
            $logout = Invoke-RestMethod -Uri "$base/api/auth/logout" -Method Post -WebSession $web -Headers $logoutHeaders -TimeoutSec 5
            if ($logout.authenticated -ne $false) { throw 'Logout did not revoke the local session.' }
            $denied = $false
            try { Invoke-WebRequest -Uri "$base/api/cloud-runners/status" -WebSession $web -UseBasicParsing -TimeoutSec 5 | Out-Null } catch { $code = [int]$_.Exception.Response.StatusCode; if ($code -eq 401) { $denied = $true } else { throw } }
            if (-not $denied) { throw 'Gateway API remained accessible after logout.' }
            # A fresh pre-auth CSRF session must allow an explicit re-login after logout.
            $reauthPreauth = Invoke-RestMethod -Uri "$base/api/auth/session" -WebSession $web -TimeoutSec 5
            if ($reauthPreauth.authenticated -ne $false -or $reauthPreauth.csrfToken.Length -lt 32) { throw 'Fresh pre-auth session was not issued after logout.' }
            $reauthHeaders = @{ Origin = $base; 'X-CSRF-Token' = $reauthPreauth.csrfToken }
            $relogin = Invoke-RestMethod -Uri "$base/api/auth/login" -Method Post -WebSession $web -Headers $reauthHeaders -ContentType 'application/json' -Body $loginBody -TimeoutSec 10
            if ($relogin.authenticated -ne $true) { throw 'Owner could not log in again after logout.' }
            $reloginSession = Invoke-RestMethod -Uri "$base/api/auth/session" -WebSession $web -TimeoutSec 5
            if ($reloginSession.authenticated -ne $true -or $reloginSession.user.role -ne 'owner') { throw 'Re-login did not establish a fresh owner session.' }
            $reloginStatus = Invoke-RestMethod -Uri "$base/api/cloud-runners/status" -WebSession $web -TimeoutSec 5
            if ($reloginStatus.gateway -ne 'READY' -or $reloginStatus.provisioning_enabled -ne $false) { throw 'Gateway access did not recover after re-login or safe defaults changed.' }
            $relogoutHeaders = @{ Origin = $base; 'X-CSRF-Token' = $reloginSession.csrfToken }
            $relogout = Invoke-RestMethod -Uri "$base/api/auth/logout" -Method Post -WebSession $web -Headers $relogoutHeaders -TimeoutSec 5
            if ($relogout.authenticated -ne $false) { throw 'Second logout did not revoke the re-login session.' }
            Write-Host 'PASS: Windows Dashboard reload -> login -> signed Gateway API -> logout/revocation -> re-login -> second logout.'
          } finally {
            $stackProcesses = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -match '(?i)-m\s+tools\.(local_auth_proxy|cloud_gateway\.server)' }
            foreach ($proc in $stackProcesses) { Stop-Process -Id ([int]$proc.ProcessId) -Force -ErrorAction SilentlyContinue }
          }

name: Local-first Minimal Emulator

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-minimal-emulator:
    name: Linux Minimal Emulator (Gateway + health + safe defaults)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Gateway runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-gateway.txt
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python -m pip install --disable-pip-version-check -r requirements-mcp.txt
      - name: Run local diagnostics and unit tests
        env:
          DCP_GATEWAY_PROVISIONING_ENABLED: "false"
          DCP_GATEWAY_OWNER_APPROVED: "false"
        run: |
          python -m tools.cloud_gateway.local_mode
          python -m unittest discover -s tests -v
      - name: Start Gateway and verify health, auth boundary, and disabled provisioning
        env:
          DCP_GATEWAY_API_TOKEN: emulator-test-token-not-for-production
          DCP_GATEWAY_HOST: 127.0.0.1
          DCP_GATEWAY_PORT: "18789"
          DCP_GATEWAY_DATABASE: ${{ runner.temp }}/dcp-emulator.sqlite3
          DCP_GATEWAY_PROVISIONING_ENABLED: "false"
          DCP_GATEWAY_OWNER_APPROVED: "false"
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time, urllib.error, urllib.request
          process = subprocess.Popen([sys.executable, "-m", "tools.cloud_gateway.server"])
          base = "http://127.0.0.1:" + os.environ["DCP_GATEWAY_PORT"]
          try:
              for _ in range(40):
                  if process.poll() is not None:
                      raise RuntimeError(f"Gateway exited early: {process.returncode}")
                  try:
                      with urllib.request.urlopen(base + "/healthz", timeout=1) as response:
                          health = json.load(response)
                      break
                  except Exception:
                      time.sleep(0.25)
              else:
                  raise RuntimeError("Gateway did not become healthy")
              assert health == {"status": "ok", "provisioning_enabled": False}, health
              request = urllib.request.Request(base + "/v1/runners/unknown")
              try:
                  urllib.request.urlopen(request, timeout=2)
                  raise AssertionError("Unauthenticated API request was accepted")
              except urllib.error.HTTPError as error:
                  assert error.code == 401, error.code
              request = urllib.request.Request(
                  base + "/v1/runners/unknown",
                  headers={"Authorization": "Bearer " + os.environ["DCP_GATEWAY_API_TOKEN"]},
              )
              try:
                  urllib.request.urlopen(request, timeout=2)
                  raise AssertionError("Unknown runner unexpectedly returned success")
              except urllib.error.HTTPError as error:
                  assert error.code == 404, error.code
              print("PASS: Gateway health, bearer-auth boundary, and local-only safe defaults")
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
          PY

  windows-11-launcher-emulator:
    name: Windows PowerShell launcher integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Gateway runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-gateway.txt
      - name: Parse all local PowerShell launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('Setup-DCP-Local.ps1', 'Run-DCP-Gateway.ps1', 'Start-DCP-Local.ps1', 'Start-DCP-Dashboard.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PASS: $file"
          }
      - name: Run setup preflight
        shell: pwsh
        run: ./Setup-DCP-Local.ps1
      - name: Start local stack and verify Gateway and Dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gatewayPort = 8789
          $dashboardRecord = Join-Path $env:LOCALAPPDATA 'DCP/dashboard-server.json'
          try {
            ./Start-DCP-Local.ps1
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:$gatewayPort/healthz" -TimeoutSec 5
            if ($health.status -ne 'ok' -or $health.provisioning_enabled -ne $false) {
              throw "Gateway health contract failed: $($health | ConvertTo-Json -Compress)"
            }
            if (-not (Test-Path -LiteralPath $dashboardRecord -PathType Leaf)) {
              throw 'Dashboard ownership record was not created.'
            }
            $record = Get-Content -LiteralPath $dashboardRecord -Raw | ConvertFrom-Json
            $dashboardUrl = "http://127.0.0.1:$($record.port)/"
            $response = Invoke-WebRequest -Uri $dashboardUrl -UseBasicParsing -TimeoutSec 5
            if ($response.StatusCode -ne 200 -or $response.Content -notmatch 'DCP') {
              throw 'Dashboard HTTP/content verification failed.'
            }
            Write-Host 'PASS: Windows local launcher, Gateway health, and Dashboard HTTP response.'
          }
          finally {
            if (Test-Path -LiteralPath $dashboardRecord -PathType Leaf) {
              $record = Get-Content -LiteralPath $dashboardRecord -Raw | ConvertFrom-Json
              $pidToStop = [int]$record.pid
              $proc = Get-CimInstance Win32_Process -Filter "ProcessId = $pidToStop" -ErrorAction SilentlyContinue
              if ($proc -and $proc.CommandLine -match '(?i)-m\s+http\.server\s+') {
                Stop-Process -Id $pidToStop -Force -ErrorAction SilentlyContinue
              }
              Remove-Item -LiteralPath $dashboardRecord -Force -ErrorAction SilentlyContinue
            }
            $gateway = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -match '(?i)-m\s+tools\.cloud_gateway\.server' }
            foreach ($proc in $gateway) {
              Stop-Process -Id ([int]$proc.ProcessId) -Force -ErrorAction SilentlyContinue
            }
          }

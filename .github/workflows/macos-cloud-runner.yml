name: DCP Multi-platform Cloud Runner Provisioning

on:
  workflow_dispatch:
    inputs:
      enable_cloud_runner_provisioning:
        description: Explicitly opt in to cloud runner provisioning (requires both repository safety variables to be true)
        required: true
        type: boolean
        default: false
      target_repository:
        description: Allowlisted repository to receive the ephemeral runner
        required: true
        default: phakphum12345/generated-A4-pdf
        type: string
      target_commit_sha:
        description: Full 40-character commit SHA to validate
        required: true
        type: string
      target_os:
        description: Operating system capacity to request
        required: true
        default: linux
        type: choice
        options: [linux, windows, macos]

permissions:
  contents: read

jobs:
  request-cloud-runner:
    if: ${{ inputs.enable_cloud_runner_provisioning == true && vars.DCP_CLOUD_RUNNER_PROVISIONING_ENABLED == 'true' && vars.DCP_CLOUD_RUNNER_OWNER_APPROVED == 'true' }}
    name: Request ephemeral runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout DCP
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and dispatch provider request
        env:
          DCP_CLOUD_RUNNER_PROVISIONING_ENABLED: ${{ vars.DCP_CLOUD_RUNNER_PROVISIONING_ENABLED }}
          DCP_CLOUD_RUNNER_OWNER_APPROVED: ${{ vars.DCP_CLOUD_RUNNER_OWNER_APPROVED }}
          DCP_RUNNER_PROVIDER_URL: ${{ secrets.DCP_RUNNER_PROVIDER_URL }}
          DCP_RUNNER_PROVIDER_TOKEN: ${{ secrets.DCP_RUNNER_PROVIDER_TOKEN }}
          DCP_TARGET_REPOSITORY: ${{ inputs.target_repository }}
          DCP_TARGET_COMMIT_SHA: ${{ inputs.target_commit_sha }}
          DCP_TARGET_OS: ${{ inputs.target_os }}
          DCP_RUNNER_ALLOWED_REPOSITORIES: phakphum12345/generated-A4-pdf
        run: python -m tools.cloud_runner

name: DCP macOS Cloud Runner Provisioning

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Allowlisted repository to receive the ephemeral macOS runner
        required: true
        default: phakphum12345/generated-A4-pdf
        type: string
      target_commit_sha:
        description: Full 40-character commit SHA to validate on macOS
        required: true
        type: string

permissions:
  contents: read

jobs:
  request-cloud-runner:
    name: Request ephemeral macOS runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout DCP
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and dispatch provider request
        env:
          DCP_RUNNER_PROVIDER_URL: ${{ secrets.DCP_RUNNER_PROVIDER_URL }}
          DCP_RUNNER_PROVIDER_TOKEN: ${{ secrets.DCP_RUNNER_PROVIDER_TOKEN }}
          DCP_TARGET_REPOSITORY: ${{ inputs.target_repository }}
          DCP_TARGET_COMMIT_SHA: ${{ inputs.target_commit_sha }}
          DCP_RUNNER_ALLOWED_REPOSITORIES: phakphum12345/generated-A4-pdf
        run: python -m tools.cloud_runner

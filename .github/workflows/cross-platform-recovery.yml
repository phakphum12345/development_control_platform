name: Cross-platform Recovery Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/cross-platform-recovery.yml"
      - "tools/cloud_gateway/**"
      - "tools/local_runner_agent/**"
      - "tests/test_cloud_gateway_job_control.py"
      - "tests/test_cloud_runner_user_api.py"
      - "tests/test_local_runner_pipeline_e2e.py"
      - "tests/test_local_auth_proxy.py"
      - "tests/test_local_runner_execution.py"
      - "tests/test_linux_sandbox.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cross-platform-recovery.yml"
      - "tools/cloud_gateway/**"
      - "tools/local_runner_agent/**"
      - "tests/test_cloud_gateway_job_control.py"
      - "tests/test_cloud_runner_user_api.py"
      - "tests/test_local_runner_pipeline_e2e.py"
      - "tests/test_local_auth_proxy.py"
      - "tests/test_local_runner_execution.py"
      - "tests/test_linux_sandbox.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-tests:
    name: Recovery tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test support dependencies
        run: |
          python -m pip install --disable-pip-version-check PyYAML jsonschema
          python -m pip install --disable-pip-version-check -r requirements-mcp.txt

      - name: Run durable JobStore recovery tests
        run: python -m unittest tests.test_cloud_gateway_job_control -v

      - name: Run authenticated Runner checkpoint and recovery API tests
        run: python -m unittest tests.test_cloud_runner_user_api -v

      - name: Run Local Runner interruption and recovery pipeline tests
        run: python -m unittest tests.test_local_runner_pipeline_e2e -v

      - name: Run Local Auth Proxy authentication and recovery integration tests
        run: python -m unittest tests.test_local_auth_proxy -v

      - name: Run Flutter executor policy and platform acceptance tests
        run: python -m unittest tests.test_local_runner_execution -v

      - name: Install bubblewrap on Linux host
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Run Linux bubblewrap launcher policy tests
        run: python -m unittest tests.test_linux_sandbox -v

      - name: Report host identity
        shell: bash
        run: |
          python -c "import os, platform, sqlite3, sys; print('OS=' + platform.platform()); print('PYTHON=' + sys.version.split()[0]); print('SQLITE=' + sqlite3.sqlite_version); print('RUNNER_OS=' + os.environ.get('RUNNER_OS', 'UNKNOWN'))"

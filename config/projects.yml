version: 1

# Opt-in registry. Projects are registered explicitly and never inferred.
projects:
  - id: phakphum-calendar
    name: Phakphum Calendar
    repository: phakphum12345/phakphum-calendar
    default_branch: main
    status_source: github
    required_gates:
      - Dart and Flutter quality
      - Unit and widget tests
      - Shift exchange audit coverage
      - Timeline actor attribution
      - Authorization and privacy review
      - GitHub Actions final gate
      - Web deployment verification

policy:
  merge_requires_all_required_gates_passed: true
  missing_gate_result: unknown
  allow_force_push: false
  allow_history_rewrite: false
  require_sha_bound_evidence: true
  require_human_approval_for_new_write_scopes: true
  integrations_enabled_by_default: false
